[project]
name = "research-agent"
version = "0.1.0"
description = "Dated oncology update briefs from live web evidence (Nebius Token Factory + Tavily), every claim cited and verified."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "tavily-python>=0.5",
    "pydantic>=2.6",
    "streamlit>=1.35",
]

[project.scripts]
research = "research_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Token Factory and Tavily APIs (skipped without keys)"]
